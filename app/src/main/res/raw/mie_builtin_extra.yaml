      width: 25
      key_back_color: '#FFFFFF'
      key_text_color: '#3F5A4E'
      key_text_size: '17'
      height: 52
      mie:
        row: 2
      round_corner: '6'
      key_border: '1'
      key_border_color: '#B8D0C3'
    - label: 数字
      click: Keyboard_custom_mint_num
      width: 25
      key_back_color: '#FFFFFF'
      key_text_color: '#3F5A4E'
      key_text_size: '17'
      height: 52
      mie:
        row: 3
      round_corner: '6'
      key_border: '1'
      key_border_color: '#B8D0C3'
    - label: 符号
      click: __mie_action:{"send":"FUNCTION","command":"__mie_symbols","option":"english","label":"表情与符号"}
      width: 25
      key_back_color: '#FFFFFF'
      key_text_color: '#3F5A4E'
      key_text_size: '17'
      height: 52
      mie:
        row: 3
      round_corner: '6'
      key_border: '1'
      key_border_color: '#B8D0C3'
    - label: 表情
      click: __mie_action:{"send":"FUNCTION","command":"__mie_symbols","option":"emoji","label":"表情"}
      width: 25
      key_back_color: '#FFFFFF'
      key_text_color: '#3F5A4E'
      key_text_size: '17'
      height: 52
      mie:
        row: 3
      round_corner: '6'
      key_border: '1'
      key_border_color: '#B8D0C3'
    - label: 英文
      click: Keyboard_custom_mint_en
      width: 25
      key_back_color: '#FFFFFF'
      key_text_color: '#3F5A4E'
      key_text_size: '17'
      height: 52
      mie:
        row: 3
      round_corner: '6'
      key_border: '1'
      key_border_color: '#B8D0C3'
    - label: 返回
      click: Keyboard_default
      width: 100
      key_back_color: '#E6F2EA'
      key_text_color: '#3F5A4E'
      key_text_size: '15'
      height: 52
      mie:
        row: 4
      round_corner: '6'
      key_border: '1'
      key_border_color: '#B8D0C3'
    mie:
      rowMargin: 1
      toolbarAlignment: legacy
      toolbarHeightDp: 36
      toolbar:
      - action: __mie_menu
        enabled: true
        icon: icons/mie2_tb_menu.png
        iconSize: 18
        width: 34
        height: 34
        appearance:
          keyBackColor: '#E6F2EA'
          roundCorner: '8'
          keyBorder: '0'
        primary: true
      - action: Hide
        enabled: true
        icon: icons/mie2_tb_hide.png
        iconSize: 18
        width: 34
        height: 34
        appearance:
          keyBackColor: '#E6F2EA'
          roundCorner: '8'
          keyBorder: '0'
      - action: clipboard
        enabled: true
        icon: icons/mie2_tb_clipboard.png
        iconSize: 18
        width: 34
        height: 34
        appearance:
          keyBackColor: '#00000000'
          roundCorner: '8'
          keyBorder: '0'
      - action: Keyboard_custom_mint_en
        enabled: true
        icon: icons/mie2_tb_lang.png
        iconSize: 18
        width: 34
        height: 34
        appearance:
          keyBackColor: '#00000000'
          roundCorner: '8'
          keyBorder: '0'
      - action: __mie_action:{"send":"FUNCTION","command":"__mie_symbols","option":"emoji","label":"表情"}
        enabled: true
        icon: icons/mie2_tb_emoji.png
        iconSize: 18
        width: 34
        height: 34
        appearance:
          keyBackColor: '#00000000'
          roundCorner: '8'
          keyBorder: '0'
      - action: __mie_floating_keyboard
        enabled: true
        icon: icons/mie2_tb_float.png
        iconSize: 18
        width: 34
        height: 34
        appearance:
          keyBackColor: '#E6F2EA'
          roundCorner: '8'
          keyBorder: '0'
        bindings:
          longClick: __mie_one_hand
      - action: Keyboard_custom_mint_layouts
        enabled: true
        icon: icons/mie2_tb_layout.png
        iconSize: 18
        width: 34
        height: 34
        appearance:
          keyBackColor: '#00000000'
          roundCorner: '8'
          keyBorder: '0'
      - action: __mie_theme_picker
        enabled: true
        icon: icons/mie2_tb_theme.png
        iconSize: 18
        width: 34
        height: 34
        appearance:
          keyBackColor: '#00000000'
          roundCorner: '8'
          keyBorder: '0'
      keyAppearance:
        keyBackColor: '#FFFFFF'
        keyTextColor: '#3F5A4E'
        roundCorner: '6'
        keyBorder: '1'
        keyBorderColor: '#B8D0C3'
        keyTextSize: '20'
      surfaceAppearance:
        keys:
          background: ''
          radius: 6.0
          blur: false
        toolbar:
          background: ''
          borderWidth: 0.0
          borderColor: ''
          radius: 8.0
          blur: false
        bar:
          background: '#F7F9F8'
          borderWidth: 0.0
          borderColor: ''
          radius: 0.0
          blur: false
        linkToolbar: false
        effects:
          shadow:
            enabled: false
          innerShadow:
            enabled: false
          gradient:
            enabled: true
            startColor: '#16FFFFFF'
            endColor: '#00000000'
            angle: 90
            opacity: 100
          borderGradient:
            enabled: false
          textShadow:
            enabled: false
          gloss: false
          noise: false
          edge3d: true
          pressScale: 1.2
          pressSink: 0.35
          pressDarken: 6
          ripple: false
          animationMs: 90
          edgeDepth: 0.6
          edgeColor: '#18B8D0C3'
        toolbarEffects:
          shadow:
            enabled: false
          innerShadow:
            enabled: false
          gradient:
            enabled: false
          borderGradient:
            enabled: false
          textShadow:
            enabled: false
          gloss: false
          noise: false
          edge3d: false
          pressScale: 1.5
          pressSink: 0.25
          pressDarken: 6
          ripple: false
          animationMs: 90
        barEffects:
          shadow:
            enabled: false
          innerShadow:
            enabled: false
          gradient:
            enabled: false
          borderGradient:
            enabled: false
          textShadow:
            enabled: false
          gloss: false
          noise: false
          edge3d: false
          pressScale: 0.0
          pressSink: 0.0
          pressDarken: 6
          ripple: false
      floatingCandidates:
        enabled: true
        panel:
          background: '#FFFFFF'
          borderWidth: 1.0
          borderColor: '#B8D0C3'
          radius: 10.0
          blur: false
        normal:
          radius: 8.0
        highlighted:
          background: '#7BC8A4'
          radius: 8.0
        pager:
          background: ''
          radius: 8.0
        colors:
          candidate: '#3F5A4E'
          highlight.candidate: '#FFFFFF'
          label: '#3F5A4E'
          highlight.label: '#FFFFFF'
          comment: '#993F5A4E'
          highlight.comment: '#EAF7F0'
          arrow: '#3F5A4E'
        elevation: 6
        itemElevation: 0
      secondaryOf: custom_mint
