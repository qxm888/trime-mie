mie:
  format: trime-custom-keyboards-yaml
  version: 1
preset_keyboards:
  custom_mint_hub:
    name: 薄荷绿 · 键盘中心
    keyboard_back_color: '#F7F9F8'
    vertical_gap: 5
    horizontal_gap: 5
    keys:
    - label: 选择键盘
      width: 100
      key_back_color: '#00000000'
      key_text_color: '#3F5A4E'
      key_text_size: '12'
      height: 36
      mie:
        row: 1
      round_corner: '6'
      key_border: '0'
      key_border_color: '#B8D0C3'
    - label: 26键
      click: Keyboard_custom_mint
      width: 25
      key_back_color: '#FFFFFF'
      key_text_color: '#3F5A4E'
      key_text_size: '17'
      height: 52
      mie:
        row: 2
      round_corner: '6'
      key_border: '1'
      key_border_color: '#B8D0C3'
    - label: 9键
      click: Keyboard_custom_mint_9
      width: 25
      key_back_color: '#FFFFFF'
      key_text_color: '#3F5A4E'
      key_text_size: '17'
      height: 52
      mie:
        row: 2
      round_corner: '6'
      key_border: '1'
      key_border_color: '#B8D0C3'
    - label: 14键
      click: Keyboard_custom_mint_14
      width: 25
      key_back_color: '#FFFFFF'
      key_text_color: '#3F5A4E'
      key_text_size: '17'
      height: 52
      mie:
