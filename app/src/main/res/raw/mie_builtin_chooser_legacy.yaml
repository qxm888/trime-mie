preset_keyboards:
  custom_mint_themes:
    name: 薄荷绿 · 主题
    keyboard_back_color: '#F7F9F8'
    vertical_gap: 5
    horizontal_gap: 5
    keys:
    - label: 选择主题（26键主键盘）
      width: 100
      key_back_color: '#00000000'
      key_text_color: '#3F5A4E'
      key_text_size: '12'
      height: 36
      mie:
        row: 1
      round_corner: '6'
      key_border: '0'
      key_border_color: '#B8D0C3'
    - label: 薄荷绿键盘（当前）
      click: Keyboard_custom_mint
      width: 100
      key_back_color: '#E6F2EA'
      key_text_color: '#3F5A4E'
      key_text_size: '16'
      height: 48
      mie:
        row: 2
      round_corner: '6'
      key_border: '1'
      key_border_color: '#B8D0C3'
    - label: 樱花粉键盘
      click: Keyboard_custom_pink
      width: 100
      key_back_color: '#FCEBED'
      key_text_color: '#5E4B50'
      key_text_size: '16'
      height: 48
      mie:
        row: 3
      round_corner: '6'
      key_border: '1'
      key_border_color: '#E3C2C8'
    - label: 浅天蓝键盘
      click: Keyboard_custom_blue
      width: 100
      key_back_color: '#E7F3FC'
      key_text_color: '#43586B'
      key_text_size: '16'
      height: 48
      mie:
        row: 4
      round_corner: '6'
      key_border: '1'
      key_border_color: '#B9D4E6'
    - label: 杏子橙键盘
      click: Keyboard_custom_orange
      width: 100
      key_back_color: '#FFF0E2'
      key_text_color: '#6B564A'
      key_text_size: '16'
      height: 48
      mie:
        row: 5
      round_corner: '6'
      key_border: '1'
      key_border_color: '#E5C7AE'
    - label: 薰衣紫键盘
      click: Keyboard_custom_purple
      width: 100
      key_back_color: '#F1E9FC'
      key_text_color: '#574B66'
      key_text_size: '16'
      height: 48
      mie:
        row: 6
      round_corner: '6'
      key_border: '1'
      key_border_color: '#D3BFE6'
    - label: 返回
      click: Keyboard_custom_mint
      width: 100
      key_back_color: '#E6F2EA'
      key_text_color: '#3F5A4E'
      key_text_size: '15'
      height: 48
      mie:
        row: 7
      round_corner: '6'
      key_border: '1'
      key_border_color: '#B8D0C3'
    mie:
      rowMargin: 1
      toolbarAlignment: legacy
      toolbarHeightDp: 36
      toolbar:
      - action: __mie_menu
        enabled: true
        icon: icons/tb_menu.png
        iconSize: 18
        width: 34
        height: 34
        appearance:
          keyBackColor: '#E6F2EA'
          roundCorner: '8'
          keyBorder: '0'
        primary: true
      - action: Hide
        enabled: true
        icon: icons/tb_hide.png
        iconSize: 18
        width: 34
        height: 34
        appearance:
          keyBackColor: '#E6F2EA'
          roundCorner: '8'
          keyBorder: '0'
      - action: clipboard
        enabled: true
        icon: icons/tb_clipboard.png
        iconSize: 18
        width: 34
        height: 34
        appearance:
          keyBackColor: '#00000000'
          roundCorner: '8'
          keyBorder: '0'
      - action: Keyboard_custom_mint_en
        enabled: true
        icon: icons/tb_lang.png
        iconSize: 18
        width: 34
        height: 34
        appearance:
          keyBackColor: '#00000000'
          roundCorner: '8'
          keyBorder: '0'
      - action: __mie_action:{"send":"FUNCTION","command":"__mie_symbols","option":"emoji","label":"表情"}
        enabled: true
        icon: icons/tb_emoji.png
        iconSize: 18
        width: 34
        height: 34
        appearance:
          keyBackColor: '#00000000'
          roundCorner: '8'
          keyBorder: '0'
      - action: __mie_floating_keyboard
        enabled: true
        icon: icons/tb_onehand.png
        iconSize: 18
        width: 34
        height: 34
        appearance:
          keyBackColor: '#E6F2EA'
          roundCorner: '8'
          keyBorder: '0'
        bindings:
          longClick: __mie_one_hand
      - action: Keyboard_custom_mint_layouts
        enabled: true
        icon: icons/tb_layout.png
        iconSize: 18
        width: 34
        height: 34
        appearance:
          keyBackColor: '#00000000'
          roundCorner: '8'
          keyBorder: '0'
      - action: Keyboard_custom_mint_themes
        enabled: true
        icon: icons/tb_theme.png
        iconSize: 18
        width: 34
        height: 34
        appearance:
          keyBackColor: '#00000000'
          roundCorner: '8'
          keyBorder: '0'
      keyAppearance:
        keyBackColor: '#FFFFFF'
        keyTextColor: '#3F5A4E'
        roundCorner: '6'
        keyBorder: '1'
        keyBorderColor: '#B8D0C3'
        keyTextSize: '20'
      surfaceAppearance:
        keys:
          background: ''
          radius: 6.0
          blur: false
        toolbar:
          background: ''
          borderWidth: 0.0
          borderColor: ''
          radius: 8.0
          blur: false
        bar:
          background: '#F7F9F8'
          borderWidth: 0.0
          borderColor: ''
          radius: 0.0
          blur: false
        linkToolbar: false
        effects:
          shadow:
            enabled: false
          innerShadow:
            enabled: false
          gradient:
            enabled: true
            startColor: '#16FFFFFF'
            endColor: '#00000000'
            angle: 90
            opacity: 100
          borderGradient:
            enabled: false
          textShadow:
            enabled: false
          gloss: false
          noise: false
          edge3d: true
          pressScale: 1.2
          pressSink: 0.35
          pressDarken: 6
          ripple: false
          animationMs: 90
          edgeDepth: 0.6
          edgeColor: '#18B8D0C3'
        toolbarEffects:
          shadow:
            enabled: false
          innerShadow:
            enabled: false
          gradient:
            enabled: false
          borderGradient:
            enabled: false
          textShadow:
            enabled: false
          gloss: false
          noise: false
          edge3d: false
          pressScale: 1.5
          pressSink: 0.25
          pressDarken: 6
          ripple: false
          animationMs: 90
        barEffects:
          shadow:
            enabled: false
          innerShadow:
            enabled: false
          gradient:
            enabled: false
          borderGradient:
            enabled: false
          textShadow:
            enabled: false
          gloss: false
          noise: false
          edge3d: false
          pressScale: 0.0
          pressSink: 0.0
          pressDarken: 6
          ripple: false
      floatingCandidates:
        enabled: true
        panel:
          background: '#FFFFFF'
          borderWidth: 1.0
          borderColor: '#B8D0C3'
          radius: 10.0
          blur: false
        normal:
          radius: 8.0
        highlighted:
          background: '#7BC8A4'
          radius: 8.0
        pager:
          background: ''
          radius: 8.0
        colors:
          candidate: '#3F5A4E'
          highlight.candidate: '#FFFFFF'
          label: '#3F5A4E'
          highlight.label: '#FFFFFF'
          comment: '#993F5A4E'
          highlight.comment: '#EAF7F0'
          arrow: '#3F5A4E'
        elevation: 6
        itemElevation: 0
      secondaryOf: custom_mint
