# 同文输入法咩版自定义键盘 —— GPT 薄荷绿设计（五色方案）
# 导入：设置 → 键盘 → 布局管理与按键编辑 → 右上菜单 → 导入自定义布局
# 图标：icons/ 文件夹需复制到  /storage/emulated/0/rime/.mie/键盘背景/icons/  下（与本文件同发布）
# 工具栏图标使用绝对路径；若 rime 目录不在默认位置，
# 请用 gen_kb_yaml.py <你的rime>/.mie/键盘背景/icons 重新生成。
# 工具栏动作：功能菜单 / 符号键盘 / 剪贴板 / 中英切换 / 悬浮键盘开关
mie:
  format: "trime-custom-keyboards-yaml"
  version: 1
preset_keyboards:
  custom_mint:
    name: "薄荷绿键盘"
    keyboard_back_color: "#F0F4EF"
    vertical_gap: 6
    horizontal_gap: 6
    mie:
      toolbarAlignment: "legacy"
      rowMargin: 2
      keyAppearance:
        keyBackColor: "#FFFFFF"
        keyTextColor: "#455B50"
        roundCorner: 14
        keyBorder: 0
      surfaceAppearance:
        keys:
          background: ""
          borderWidth: 0
          borderColor: ""
          radius: 14
          blur: false
        toolbar:
          background: ""
          borderWidth: 0
          borderColor: ""
          radius: 12
          blur: false
        bar:
          background: "#F0F4EF"
          borderWidth: 0
          borderColor: ""
          radius: 0
          blur: false
        linkToolbar: false
        effects:
          shadow:
            enabled: false
          innerShadow:
            enabled: false
          gradient:
            enabled: false
          borderGradient:
            enabled: false
          textShadow:
            enabled: false
          gloss: false
          noise: false
          edge3d: false
          pressScale: 0
          pressSink: 0
          pressDarken: 8
          ripple: false
        toolbarEffects:
          shadow:
            enabled: false
          innerShadow:
            enabled: false
          gradient:
            enabled: false
          borderGradient:
            enabled: false
          textShadow:
            enabled: false
          gloss: false
          noise: false
          edge3d: false
          pressScale: 0
          pressSink: 0
          pressDarken: 8
          ripple: false
        barEffects:
          shadow:
            enabled: false
          innerShadow:
            enabled: false
          gradient:
            enabled: false
          borderGradient:
            enabled: false
          textShadow:
            enabled: false
          gloss: false
          noise: false
          edge3d: false
          pressScale: 0
          pressSink: 0
          pressDarken: 8
          ripple: false
      toolbar:
      - action: "menu_keyboard"
        enabled: true
        icon: "/storage/emulated/0/rime/.mie/键盘背景/icons/tb_switch.png"
        iconSize: 30
        appearance:
          keyBackColor: "#E2F2E7"
          roundCorner: 12
          keyBorder: 0
      - action: "liquid_keyboard"
        enabled: true
        icon: "/storage/emulated/0/rime/.mie/键盘背景/icons/tb_symbols.png"
        iconSize: 30
        appearance:
          keyBackColor: "#E2F2E7"
          roundCorner: 12
          keyBorder: 0
      - action: "clipboard_window"
        enabled: true
        icon: "/storage/emulated/0/rime/.mie/键盘背景/icons/tb_clipboard.png"
        iconSize: 30
        appearance:
          keyBackColor: "#E2F2E7"
          roundCorner: 12
          keyBorder: 0
      - action: "Mode_switch"
        enabled: true
        icon: "/storage/emulated/0/rime/.mie/键盘背景/icons/tb_lang.png"
        iconSize: 30
        appearance:
          keyBackColor: "#E2F2E7"
          roundCorner: 12
          keyBorder: 0
      - action: "__mie_toggle_floating_keyboard"
        enabled: true
        icon: "/storage/emulated/0/rime/.mie/键盘背景/icons/tb_float.png"
        iconSize: 30
        appearance:
          keyBackColor: "#E2F2E7"
          roundCorner: 12
          keyBorder: 0
