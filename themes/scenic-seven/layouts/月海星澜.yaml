# 键灵输入法 · 风景主题「月海星澜」（咩版导入版）
#
# 用法：同文咩版 → 键盘编辑/自定义键盘 → 导入布局 → 选择本文件。
# 素材：同目录上一级的 `.mie/键盘背景/keyling/` 必须已放到 rime 用户目录下，
#       否则键帽与底图会显示为空。
#
# 由 modular-ime/tools/export_mie_scenic_themes.py 从键灵内置布局生成，请勿手改。

name: 月海星澜
author: "键灵输入法 × 同文咩版"
config_version: 1.0
mie:
  format: trime-custom-keyboards-yaml
  version: 1
style:
  color_scheme: stock
  keyboard_padding: 1
  keyboard_padding_bottom: 0
  key_text_size: 20
  key_height: 52
  candidate_view_height: 36
preset_color_schemes:
  stock:
    name: 月海星澜
    keyboard_back_color: "#12233E"
    candidate_background: "#12233E"
    key_back_color: "#99203556"
    key_text_color: "#E9F8FF"
    key_symbol_color: "#E9F8FF"
    candidate_text_color: "#E9F8FF"
    hilited_candidate_text_color: "#E9F8FF"
    hilited_candidate_back_color: "#B937648B"
    hilited_key_back_color: "#B937648B"
    comment_text_color: "#BBDCF1"
    label_color: "#BBDCF1"
    border_color: "#6696DFFF"
preset_keyboards:
  default:
    import_preset: custom_scenic_moon_sea
  custom_scenic_moon_sea:
    name: 月海星澜
    label_transform: uppercase
    ascii_mode: 0
    reset_ascii_mode: true
    ascii_keyboard: custom_scenic_moon_sea_en
    lock: true
    keyboard_back_color: keyling/moon-sea/background.png
    vertical_gap: 8
    horizontal_gap: 5
    keyboard_height: 251
